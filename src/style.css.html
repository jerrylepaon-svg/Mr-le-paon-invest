<style>
:root{--deep:#04342C;--em:#0F6E56;--mint:#E1F5EE;--mint2:#9FE1CB;--gold:#EF9F27;--gold2:#FAC775;--goldbg:#FAEEDA;--golddk:#633806;--ink:#10201B;--mut:#56645F;--line:#E3E8E6;--bg:#F4F6F5;--card:#fff;--red:#B42318;--green:#0F6E56}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;margin:0;line-height:1.2}
a{color:var(--em)}
button,input,select{font-family:inherit;font-size:15px}
button{cursor:pointer;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:0 16px;min-height:44px;font-weight:600}
button.pri{background:var(--em);border-color:var(--em);color:#fff}
button.gold{background:var(--gold);border-color:var(--gold);color:#412402}
button.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
button.dang{color:var(--red);border-color:#F3C5C0}
input,select{width:100%;min-height:44px;border:1px solid #CBD3D0;border-radius:10px;padding:0 12px;background:#fff;color:var(--ink)}
input[type=date]{min-height:36px;font-size:13px;padding:0 8px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
header.top{background:var(--deep);color:#fff}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;color:#fff;text-decoration:none}
.brand span{color:var(--gold2)}
.navl{display:flex;gap:6px;flex-wrap:wrap}
.navl a{color:#fff;text-decoration:none;font-size:14px;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.25)}
.navl a.on{background:var(--gold);color:#412402;border-color:var(--gold)}
.hero{padding:28px 0 36px}
.hero h1{font-size:32px;max-width:620px}
.hero p{color:var(--mint2);max-width:560px;margin:10px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:20px;max-width:620px}
.stat{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 14px}
.stat small{display:block;color:var(--mint2);font-size:12px}
.stat b{font-size:18px}
main{padding:26px 0 50px}
.sec{margin-bottom:30px}
.sec>h2{font-size:22px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.step{display:flex;gap:12px;align-items:flex-start}
.num{width:30px;height:30px;border-radius:50%;background:var(--mint);color:var(--deep);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.muted{color:var(--mut);font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.t-gold{background:var(--goldbg);color:var(--golddk)}
.t-mint{background:var(--mint);color:#085041}
.t-gray{background:#EEF1F0;color:var(--mut)}
.bar{height:8px;background:#E7ECEA;border-radius:4px;overflow:hidden;margin:10px 0 6px}
.bar>div{height:100%;background:#1D9E75}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.money{font-weight:700}
.plus{color:var(--green)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv .card{padding:14px}
.kv small{display:block;color:var(--mut);font-size:12px}
.kv b{font-size:20px}
.tl{display:flex;gap:6px;margin-top:12px}
.tl .st{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.tl .dot{height:6px;border-radius:3px;background:#E7ECEA;margin-bottom:6px}
.tl .st.done .dot{background:#1D9E75}
.tl .st.done{color:var(--ink)}
.err{color:var(--red);font-size:13px;margin-top:6px;min-height:0}
.ok{background:var(--mint);color:#085041;border-radius:12px;padding:12px;font-size:14px;margin-top:10px}
.note{background:var(--goldbg);color:var(--golddk);border-radius:12px;padding:12px;font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.tbl th{text-align:left;color:var(--mut);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.scroll{overflow-x:auto}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px}
.hidden{display:none}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px 0 40px}
details summary{cursor:pointer;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.pay div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pay b{font-size:17px;letter-spacing:.5px}
@media (max-width:520px){.hero h1{font-size:26px}}
</style>
